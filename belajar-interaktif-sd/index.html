<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Belajar Interaktif SD</title><style>body{font-family:system-ui,sans-serif;display:grid;place-items:center;min-height:100vh;margin:0;background:#f7f8fc;color:#172033}.box{text-align:center;padding:24px}.spin{width:36px;height:36px;border:4px solid #ddd;border-top-color:#5b5bd6;border-radius:50%;animation:s 1s linear infinite;margin:auto}@keyframes s{to{transform:rotate(360deg)}}</style></head><body><div class="box"><div class="spin"></div><p>Memuat aplikasi belajar…</p></div><script>(async()=>{try{let b='';for(let i=1;i<=3;i++){b+=await fetch('assets/part'+i+'.txt').then(r=>{if(!r.ok)throw Error('part '+i);return r.text()})}const bytes=Uint8Array.from(atob(b.trim()),c=>c.charCodeAt(0));const html=new TextDecoder().decode(bytes);document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<div class="box"><h2>Aplikasi belum dapat dimuat</h2><p>Silakan refresh halaman beberapa saat lagi.</p></div>'}})();</script></body></html>
